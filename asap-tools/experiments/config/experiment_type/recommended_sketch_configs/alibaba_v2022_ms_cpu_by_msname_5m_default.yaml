# @package _global_
# Generated by recommended_sketch_configs.py; do not edit.
experiment_params:
  experiment:
  - mode: sketchdb
    server: sketchdb
    query_prometheus_too: true
  monitoring:
    tool: prometheus
    deployment_mode: bare_metal
  servers:
  - name: prometheus
    url: http://localhost:9090
  - name: sketchdb
    url: http://localhost:8088
  exporters:
    only_start_if_queries_exist: true
    exporter_list:
      cluster_data_exporter:
        provider: alibaba
        port: 40000
        data_type: msresource
        data_year: 2022
        parts_mode: part-index
        part_index: 0
  query_groups:
  - id: 1
    queries:
    - sum by (ms_name) (sum_over_time(alibaba_microservice_cpu_usage[5m]))
    repetition_delay_ms: 5000
    client_options:
      repetitions: 20
      query_time_offset: 10
      starting_delay: 390
    controller_options:
      accuracy_sla: 0.99
      latency_sla: 1
  metrics:
  - metric: alibaba_microservice_cpu_usage
    labels:
    - instance
    - job
    - ms_name
    - ms_instance_id
    - node_id
    exporter: cluster_data_exporter
cluster_data_directory: /data/cluster_traces/alibaba_msmetrics
