# @package _global_
# Generated by recommended_sketch_configs.py; do not edit.
experiment_params:
  experiment:
  - mode: sketchdb
    server: sketchdb
    query_prometheus_too: true
  monitoring:
    tool: prometheus
    deployment_mode: bare_metal
  servers:
  - name: prometheus
    url: http://localhost:9090
  - name: sketchdb
    url: http://localhost:8088
  exporters:
    only_start_if_queries_exist: true
    exporter_list:
      cluster_data_exporter:
        provider: google
        port: 40000
        metrics: mean-cpu-usage-rate
        parts_mode: part-index
        part_index: 0
        scrape_timeout: 1s
  query_groups:
  - id: 1
    queries:
    - quantile(0.99, google_mean_cpu_usage_rate_0)
    repetition_delay_ms: 5000
    client_options:
      repetitions: 20
      query_time_offset: 10
      starting_delay: 90
    controller_options:
      accuracy_sla: 0.99
      latency_sla: 1
  metrics:
  - metric: google_mean_cpu_usage_rate_0
    labels:
    - instance
    - job
    - job_id
    - task_index
    - machine_id
    exporter: cluster_data_exporter
cluster_data_directory: /data/cluster_traces/google
