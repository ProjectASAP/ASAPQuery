cleanup_policy:
  name: circular_buffer
metrics:
  data:
  - job
  - label_0
  - region
  - service
queries:
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 90
  query: sum by (region, service) (sum_over_time(data[30m]))
  planned_subquery: sum by (job, region, service) (sum_over_time(data[30m]))
  query_time_aggregations:
  - operator: sum
    grouping:
      mode: by
      labels:
      - region
      - service
    parameter: null
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 90
  query: sum by (region, service, job) (sum_over_time(data[30m]))
  planned_subquery: sum by (region, service, job) (sum_over_time(data[30m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 3
    num_aggregates_to_retain: 176
