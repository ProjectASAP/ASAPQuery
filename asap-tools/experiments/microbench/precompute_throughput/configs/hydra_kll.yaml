# P6: keyed quantiles (KLL per CMS cell). 10 groups (l0); keys on l1..l4.
# Params are the planner defaults (asap-planner-rs/src/planner/sketch.rs).
aggregations:
- aggregationId: 1
  aggregationType: HydraKLL
  aggregationSubType: ''
  parameters:
    depth: 3
    width: 1024
    K: 20
  labels:
    grouping: [l0]
    aggregated: [l1, l2, l3, l4]
    rollup: []
  metric: bench_metric
  spatialFilter: ''
  windowType: tumbling
  windowSizeMs: 10000
  slideIntervalMs: 10000
metrics:
  bench_metric: [l0, l1, l2, l3, l4]
