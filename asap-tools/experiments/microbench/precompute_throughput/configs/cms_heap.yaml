# P5: keyed top-k. 10 groups (l0); each sketch keys on l1..l4.
aggregations:
- aggregationId: 1
  aggregationType: CountMinSketchWithHeap
  aggregationSubType: sum
  parameters:
    depth: 3
    width: 1024
    heapsize: 20
  labels:
    grouping: [l0]
    aggregated: [l1, l2, l3, l4]
    rollup: []
  metric: bench_metric
  spatialFilter: ''
  windowType: tumbling
  windowSizeMs: 10000
  slideIntervalMs: 10000
metrics:
  bench_metric: [l0, l1, l2, l3, l4]
