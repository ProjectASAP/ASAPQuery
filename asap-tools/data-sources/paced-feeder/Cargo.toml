[package]
name = "paced_feeder"
version = "0.1.0"
edition = "2021"
description = "Generates a seeded synthetic workload on the fly and sends it in real time to ASAPQuery (Prometheus remote write) or ClickHouse (RowBinary INSERT)"

[[bin]]
name = "paced_feeder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
prost = "0.13"
reqwest = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snap = "1"
tokio = { version = "1.0", features = ["full"] }

# Standalone tool, not a member of the root workspace.
[workspace]
