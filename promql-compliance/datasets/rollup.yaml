name: rollup
series:
  # rollup_latency{service, endpoint}: 2 services x 10 endpoints at 60s
  # cadence, plus endpoint e-late on service a that starts at offset 600 so
  # roll-ups see a subpopulation appear mid-range.
  #
  # With i = endpoint*2 + service (e-late is i = 20), value = 1000 + 2*i +
  # 10*(t/60). Within one service adjacent values are 4 apart (under 0.5%),
  # which bounds the gap between ASAPQuery's nearest-rank quantile and
  # Prometheus' interpolated one well inside the suite's sketch tolerance.
  #
  # Samples run to offset 1260, past the last evaluated offset (1200).
  - metric: rollup_latency
    labels:
      service: a
      endpoint: e00
    samples:
      - {offset_seconds: 0, value: 1000}
      - {offset_seconds: 60, value: 1010}
      - {offset_seconds: 120, value: 1020}
      - {offset_seconds: 180, value: 1030}
      - {offset_seconds: 240, value: 1040}
      - {offset_seconds: 300, value: 1050}
      - {offset_seconds: 360, value: 1060}
      - {offset_seconds: 420, value: 1070}
      - {offset_seconds: 480, value: 1080}
      - {offset_seconds: 540, value: 1090}
      - {offset_seconds: 600, value: 1100}
      - {offset_seconds: 660, value: 1110}
      - {offset_seconds: 720, value: 1120}
      - {offset_seconds: 780, value: 1130}
      - {offset_seconds: 840, value: 1140}
      - {offset_seconds: 900, value: 1150}
      - {offset_seconds: 960, value: 1160}
      - {offset_seconds: 1020, value: 1170}
      - {offset_seconds: 1080, value: 1180}
      - {offset_seconds: 1140, value: 1190}
      - {offset_seconds: 1200, value: 1200}
      - {offset_seconds: 1260, value: 1210}
