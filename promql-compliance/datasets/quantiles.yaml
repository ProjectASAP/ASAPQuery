name: quantiles
series:
  # ASAPQuery's KLL quantile returns an observed sample (nearest rank);
  # Prometheus interpolates between neighbours. The gap is bounded by the
  # spacing between adjacent sorted values, so both metrics keep that
  # spacing well under the suite's 1% tolerance while p10 and p90 stay far
  # enough apart that a wrong-quantile bug still fails.
  #
  # quantile_dense: one series per job at 1s cadence, so every 5m window has
  # 300 samples (below the planner's default KLL K=500, so no compaction).
  # value = 1000*(job+1) + ((t * k) mod 300) + t with k in 37/71/113 (coprime
  # to 300), which shuffles values within each window instead of sorting
  # them by time.
  #
  # quantile_wide: 3 jobs x 40 instances at 60s cadence, for cross-series
  # quantile(). With i = instance*3 + job, value = 1000 + 2*i + 10*(t/60).
  #
  # Both run to offset_seconds 1260, past the last evaluated offset (1200).
  - metric: quantile_dense
    labels:
      job: frontend
      instance: i-1
    samples:
      - {offset_seconds: 0, value: 1000}
      - {offset_seconds: 1, value: 1038}
