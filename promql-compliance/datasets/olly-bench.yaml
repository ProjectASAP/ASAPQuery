name: olly-bench
series:
  # Generated by a Python script (not checked in) that loops over the series
  # below and evaluates each formula at every 15s offset.
  #
  # Stand-in data for the olly-bench queries (suites/olly-bench.yaml). All
  # series sample every 15s from offset 0 to 1260, past the suite's last
  # evaluated offset (1200). The suite's earliest lookback (subquery [10m:]
  # over rate[5m]) is 900s, so the evaluation grid starts at 900.
  #
  # backend_* series: jobs api/worker/gateway x instances i-1/i-2, indexed
  # s = 0..5 in file order. No two series or jobs tie, so topk and sort_desc
  # have one answer.
  # - Counters grow linearly: requests at (10+3s)/s, cpu at (0.1+0.03s)/s,
  #   5xx at (0.5+0.2s)/s except job worker, which stays 0 so the `> 0`
  #   filter drops it.
  # - Gauges cycle with t: memory 1e9*(s+1) + 1e6*((t/15*7) mod 20),
  #   backlog 10*(s+1) + ((t/15*3) mod 8), cache lag 60*(s+1) + ((t/15*5) mod 11).
  # payment/order/user service series: one job, instances i-1/i-2, same
  # shapes. order_service's duration histogram splits (4+i)/s requests
  # across le buckets 0.1/0.25/0.5/1/+Inf at cumulative 20/50/80/95/100%.
  - metric: backend_http_requests_total
    labels:
      job: "api"
      instance: "i-1"
