name: aggregations
series:
  # Every series has one sample per scrape interval, at or faster than the
  # 60s query step; cadences slower than the step are not covered.
  #
  # Series j (1..6, in file order) has value j * (100 + t) and a distinct
  # cadence of 60s, 30s, 20s, 15s, 12s, 10s, so count_over_time(data[5m]) is
  # 5, 10, ..., 30: no ties for topk to break differently, globally or by job.
  #
  # Samples run to offset_seconds 1260, past the suite's last evaluated
  # offset (1200) so the trailing window has a real later sample to close on,
  # instead of only the wall-clock idle fallback.
  - metric: data
    labels:
      job: frontend
      instance: i-1
    samples:
      - {offset_seconds: 0, value: 100}
      - {offset_seconds: 60, value: 160}
      - {offset_seconds: 120, value: 220}
