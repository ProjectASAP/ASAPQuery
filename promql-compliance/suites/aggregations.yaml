  - name: quantile-0.4
    expr: "quantile(0.4, data)"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: quantile-0.5
    expr: "quantile(0.5, data)"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: quantile-0.6
    expr: "quantile(0.6, data)"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: quantile-0.7
    expr: "quantile(0.7, data)"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: quantile-0.8
    expr: "quantile(0.8, data)"
    instant_offsets_seconds: *evaluation_offsets
