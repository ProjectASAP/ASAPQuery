    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: sum-without-job-sum-over-time
    expr: "sum without (job) (sum_over_time(data[5m]))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range

  - name: sum-count-over-time
    expr: "sum(count_over_time(data[5m]))"
    instant_offsets_seconds: *evaluation_offsets
