    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range

  - name: topk-1-count-over-time
    expr: "topk(1, count_over_time(data[5m]))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: topk-3-count-over-time
