    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: topk-5-count-over-time-by-job
    expr: "topk by (job) (5, count_over_time(data[5m]))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: topk-10-count-over-time-by-job
