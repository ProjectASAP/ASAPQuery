# Hand-written in the planner's output format. Queries grouped by a subset of
# an aggregation's grouping labels point at that aggregation, so the engine
# answers them by rolling the per-(service, endpoint) aggregates up.
# no_cleanup: several queries read the same windows, so a per-query read
# count threshold would evict windows other queries still need.
cleanup_policy:
  name: no_cleanup
metrics:
  rollup_latency:
  - endpoint
  - service
queries:
- aggregations:
  - aggregation_id: 1
  query: quantile by (service, endpoint) (0.5, rollup_latency)
  planned_subquery: quantile by (service, endpoint) (0.5, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 1
  query: quantile by (service) (0.5, rollup_latency)
  planned_subquery: quantile by (service) (0.5, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 1
  query: quantile(0.5, rollup_latency)
  planned_subquery: quantile(0.5, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 1
  query: quantile by (service, endpoint) (0.9, rollup_latency)
  planned_subquery: quantile by (service, endpoint) (0.9, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 1
  query: quantile by (service) (0.9, rollup_latency)
  planned_subquery: quantile by (service) (0.9, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 1
  query: quantile(0.9, rollup_latency)
  planned_subquery: quantile(0.9, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 2
  query: quantile by (service, endpoint) (0.75, rollup_latency)
  planned_subquery: quantile by (service, endpoint) (0.75, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 2
  query: quantile by (service) (0.75, rollup_latency)
  planned_subquery: quantile by (service) (0.75, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 2
  query: quantile(0.75, rollup_latency)
  planned_subquery: quantile(0.75, rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 3
  query: sum by (service, endpoint) (rollup_latency)
  planned_subquery: sum by (service, endpoint) (rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 3
  query: sum by (service) (rollup_latency)
  planned_subquery: sum by (service) (rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 3
  query: sum(rollup_latency)
  planned_subquery: sum(rollup_latency)
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 4
  query: sum by (service, endpoint) (sum_over_time(rollup_latency[5m]))
  planned_subquery: sum by (service, endpoint) (sum_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 4
  query: sum by (service) (sum_over_time(rollup_latency[5m]))
  planned_subquery: sum by (service) (sum_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 4
  query: sum(sum_over_time(rollup_latency[5m]))
  planned_subquery: sum(sum_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 5
  query: min by (service, endpoint) (min_over_time(rollup_latency[5m]))
  planned_subquery: min by (service, endpoint) (min_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 5
  query: min by (service) (min_over_time(rollup_latency[5m]))
  planned_subquery: min by (service) (min_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 5
  query: min(min_over_time(rollup_latency[5m]))
  planned_subquery: min(min_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 6
  query: max by (service, endpoint) (max_over_time(rollup_latency[5m]))
  planned_subquery: max by (service, endpoint) (max_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 6
  query: max by (service) (max_over_time(rollup_latency[5m]))
  planned_subquery: max by (service) (max_over_time(rollup_latency[5m]))
  query_time_aggregations: []
- aggregations:
  - aggregation_id: 6
  query: max(max_over_time(rollup_latency[5m]))
  planned_subquery: max(max_over_time(rollup_latency[5m]))
  query_time_aggregations: []
