name: nested-aggregations
comparison_defaults:
  value_tolerance:
    relative: 0.01
    absolute: 0.000001

# Prometheus is the reference for each instant and range result. Every query
# starts from a planner-supported anchor and leaves one or two aggregation
# stages for ASAPQuery's query-time pipeline.
queries:
  - name: one-stage-sum
    expr: "sum by (job) (sum by (job, instance) (data))"
    instant_offsets_seconds: &evaluation_offsets [300, 600, 900, 1200]
    range: &evaluation_range
      start_offset_seconds: 300
      end_offset_seconds: 1200
      step_seconds: 60
  - name: one-stage-count
    expr: "count by (job) (sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-avg
    expr: "avg by (job) (sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-min
    expr: "min by (job) (sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-max
    expr: "max by (job) (sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-topk-3
    expr: "topk by (job) (3, sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  # A bare-selector TopK keeps __name__ until final formatting. The outer
  # aggregation makes the native path execute that raw TopK result first.
  - name: bare-topk-by-job-then-sum
    expr: "sum by (job) (topk by (job) (3, data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-quantile-0-5
    expr: "quantile by (job) (0.5, sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-quantile-0-75
    expr: "quantile by (job) (0.75, sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: one-stage-quantile-0-9
    expr: "quantile by (job) (0.9, sum by (job, instance) (data))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-sum
    expr: "sum by (job) (sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-count
    expr: "count by (job) (sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-avg
    expr: "avg by (job) (sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-min
    expr: "min by (job) (sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-max
    expr: "max by (job) (sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-topk-3
    expr: "topk by (job) (3, sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: two-stage-sum-then-quantile-0-5
    expr: "quantile by (job) (0.5, sum by (job) (sum by (job, instance) (data)))"
    instant_offsets_seconds: *evaluation_offsets
