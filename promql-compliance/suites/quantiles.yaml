name: quantiles
comparison_defaults:
  value_tolerance:
    relative: 0.01
    absolute: 0.000001

queries:
  # Evaluation grid matches aggregations.yaml. Temporal quantiles use the
  # dense 1s series; cross-series quantiles use the 120-series wide metric.
  - name: quantile-over-time-0.1
    expr: "quantile_over_time(0.1, quantile_dense[5m])"
    instant_offsets_seconds: &evaluation_offsets [300, 600, 900, 1200]
    range: &evaluation_range
      start_offset_seconds: 300
      end_offset_seconds: 1200
      step_seconds: 60
  - name: quantile-over-time-0.2
    expr: "quantile_over_time(0.2, quantile_dense[5m])"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
  - name: quantile-over-time-0.3
    expr: "quantile_over_time(0.3, quantile_dense[5m])"
    instant_offsets_seconds: *evaluation_offsets
    range: *evaluation_range
