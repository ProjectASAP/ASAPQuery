# SQL equivalents of promql-compliance/suites/aggregations.yaml; case names match.
#
# Translation: `[5m]` range functions aggregate over a 300s window; instant
# vectors aggregate over one ingestion interval (1s). A per-series result
# groups by every label (job, instance). Per-group top-k uses `LIMIT k BY`.
#
# Skipped, no SQL equivalent for counter rate/increase: increase, rate,
# topk-3-rate, topk-3-rate-by-job, topk-3-rate-by-job-instance,
# sum-by-job-rate, sum-by-job-instance-rate.
tables:
  - name: data
    time_column: time
    value_columns: [value]
    metadata_columns: [job, instance]
data_ingestion_interval_ms: 1000
repetition_delay_ms: 60000

cases:
  - name: sum-over-time
    query: SELECT job, instance, SUM(value) FROM data WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: count-over-time
    query: SELECT job, instance, COUNT(value) FROM data WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: avg-over-time
    query: SELECT job, instance, AVG(value) FROM data WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: unsupported
  - name: min-over-time
    query: SELECT job, instance, MIN(value) FROM data WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: max-over-time
    query: SELECT job, instance, MAX(value) FROM data WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported

  - name: topk-1-bare
    query: SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance ORDER BY v DESC LIMIT 1
    expected: supported
  - name: topk-3-bare
    query: SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance ORDER BY v DESC LIMIT 3
    expected: supported
  - name: topk-5-bare
    query: SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance ORDER BY v DESC LIMIT 5
    expected: supported
  - name: topk-10-bare
