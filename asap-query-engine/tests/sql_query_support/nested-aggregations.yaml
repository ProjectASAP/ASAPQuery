# SQL equivalents of promql-compliance/suites/nested-aggregations.yaml; case
# names match. Each PromQL aggregation stage is one SELECT layer:
#   anchor  sum by (job, instance) (data)
#           -> SELECT job, instance, SUM(value) AS v FROM data WHERE <1s> GROUP BY job, instance
#   stage   agg by (job) (x)          -> SELECT job, AGG(v) AS m FROM (x) GROUP BY job
#   stage   topk by (job) (3, x)      -> SELECT job, ..., v FROM (x) ORDER BY v DESC LIMIT 3 BY job
# The instant-vector anchor aggregates over one ingestion interval (1s).
tables:
  - name: data
    time_column: time
    value_columns: [value]
    metadata_columns: [job, instance]
data_ingestion_interval_ms: 1000
repetition_delay_ms: 60000

cases:
  - name: one-stage-sum
    query: SELECT job, SUM(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-count
    query: SELECT job, COUNT(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-avg
    query: SELECT job, AVG(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-min
    query: SELECT job, MIN(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-max
    query: SELECT job, MAX(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-topk-3
    query: SELECT job, instance, v FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) ORDER BY v DESC LIMIT 3 BY job
    expected: unsupported
  - name: bare-topk-by-job-then-sum
    query: SELECT job, SUM(v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance ORDER BY v DESC LIMIT 3 BY job) GROUP BY job
    expected: unsupported
  - name: one-stage-quantile-0-5
    query: SELECT job, QUANTILE(0.5, v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-quantile-0-75
    query: SELECT job, QUANTILE(0.75, v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported
  - name: one-stage-quantile-0-9
    query: SELECT job, QUANTILE(0.9, v) FROM (SELECT job, instance, SUM(value) AS v FROM data WHERE time BETWEEN DATEADD(s, -1, NOW()) AND NOW() GROUP BY job, instance) GROUP BY job
    expected: supported

