    expected: supported
  - name: quantile-over-time-0.8
    query: SELECT job, instance, QUANTILE(0.8, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: quantile-over-time-0.9
    query: SELECT job, instance, QUANTILE(0.9, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: quantile-over-time-0.95
    query: SELECT job, instance, QUANTILE(0.95, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: quantile-over-time-0.99
    query: SELECT job, instance, QUANTILE(0.99, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: quantile-over-time-ratio-0.9-0.5
    query: SELECT job, instance, QUANTILE(0.9, value) / QUANTILE(0.5, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: unsupported

