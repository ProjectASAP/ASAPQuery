# SQL equivalents of promql-compliance/suites/quantiles.yaml; case names match.
# `[5m]` range functions aggregate over a 300s window; instant vectors over
# one ingestion interval (1s). A per-series result groups by (job, instance).
tables:
  - name: quantile_dense
    time_column: time
    value_columns: [value]
    metadata_columns: [job, instance]
  - name: quantile_wide
    time_column: time
    value_columns: [value]
    metadata_columns: [job, instance]
data_ingestion_interval_ms: 1000
repetition_delay_ms: 60000

cases:
  - name: quantile-over-time-0.1
    query: SELECT job, instance, QUANTILE(0.1, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
  - name: quantile-over-time-0.2
    query: SELECT job, instance, QUANTILE(0.2, value) FROM quantile_dense WHERE time BETWEEN DATEADD(s, -300, NOW()) AND NOW() GROUP BY job, instance
    expected: supported
