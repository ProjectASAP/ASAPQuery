query_groups:
  - id: 1
    index: metrics
    time_field: "@timestamp"
    queries:
      - |
        {
          "aggs": {
            "avg_cpu": {
              "avg": {
                "field": "cpu_usage"
              }
            }
          },
          "query": {
            "bool": {
              "filter": [
                {
                  "range": {
                    "@timestamp": {
                      "gte": "now-5m",
                      "lte": "now"
                    }
                  }
                }
              ]
            }
          }
        }
    repetition_delay_ms: 300000
    controller_options:
      accuracy_sla: 0.95
      latency_sla: 1.0
aggregate_cleanup:
  policy: read_based
