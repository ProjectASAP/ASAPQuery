# Label-set facts for optimizer-workload.example.yaml (asap-optimizer-cli --label-set-facts).
series:
  - {metric: http_requests_total, spatial_filter: 'env="prod"', series_count: 200}
  - {metric: latency_ms, spatial_filter: "", series_count: 50}
groups:
  # sum by (job): output labels [job].
  - {metric: http_requests_total, spatial_filter: 'env="prod"', grouping_labels: [job], cardinality: 10}
  # quantile_over_time keeps every label.
  - {metric: latency_ms, spatial_filter: "", grouping_labels: [instance], cardinality: 50}
