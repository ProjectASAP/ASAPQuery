[workspace]
resolver = "2"
members = [
    "asap-common/dependencies/rs/promql_utilities",
    "asap-common/dependencies/rs/sql_utilities",
    "asap-common/dependencies/rs/elastic_dsl_utilities",
    "asap-common/dependencies/rs/asap_types",
    "asap-common/tests/compare_matched_tokens/rust_tests",
    "asap-common/tests/compare_patterns",
    "asap-query-engine",
    "asap-planner-rs",
]

[workspace.package]
edition = "2021"
version = "0.5.0"

[workspace.dependencies]
# Shared external deps (used by 2+ crates)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
promql-parser = "0.5.0"
tokio = { version = "1.0", features = ["full"] }

# Internal crates
promql_utilities = { path = "asap-common/dependencies/rs/promql_utilities" }
sql_utilities = { path = "asap-common/dependencies/rs/sql_utilities" }
asap_types = { path = "asap-common/dependencies/rs/asap_types" }
elastic_dsl_utilities = { path = "asap-common/dependencies/rs/elastic_dsl_utilities" }
asap_planner = { path = "asap-planner-rs" }
# Pin past the published releases to pick up the CMS estimate i32::MAX clamp fix
# (ProjectASAP/asap_sketchlib#76) and DDSketch's zero bucket and negative store
# (ProjectASAP/asap_sketchlib#141). Revert to a published version once released.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "5158bf232894e8f816f906dc535677b56bd81d5a" }
indexmap = { version = "2.0", features = ["serde"] }

[profile.release]
debug = 1  # line table + symbol names for flamegraph; no effect on codegen or runtime perf
strip = "none"
